<!DOCTYPE html>
<html>
<body>
  <p id="out"></p>
  <script>
    function bubble(arr){
      for(let i=0;i<arr.length;i++)
        for(let j=0;j<arr.length-i-1;j++)
          if(arr[j]>arr[j+1]) [arr[j],arr[j+1]]=[arr[j+1],arr[j]];
      return arr;
    }
    document.getElementById("out").innerText = bubble([5,2,9,1,3]);
  </script>
</body>
</html>
