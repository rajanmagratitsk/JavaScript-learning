<!DOCTYPE html>
<html>
<head>
  <title>Odd Even Checker</title>
</head>
<body>
  <h2>Odd or Even</h2>
  <input id="num" type="number" placeholder="Enter a number">
  <button onclick="check()">Check</button>
  <p id="output"></p>

  <script>
    function check() {
      let n = document.getElementById("num").value;
      if (n % 2 === 0) {
        document.getElementById("output").innerText = n + " is Even";
      } else {
        document.getElementById("output").innerText = n + " is Odd";
      }
    }
  </script>
</body>
</html>
