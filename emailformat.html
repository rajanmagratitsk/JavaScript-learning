<!DOCTYPE html>
<html>
<body>
  <input id="email" placeholder="Enter email">
  <button onclick="check()">Check</button>
  <p id="res"></p>

  <script>
    function check(){
      let e=document.getElementById("email").value;
      let pattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
      document.getElementById("res").innerText = pattern.test(e) ? "Valid Email" : "Invalid Email";
    }
  </script>
</body>
</html>
