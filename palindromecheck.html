<!DOCTYPE html>
<html>
<head>
  <title>Palindrome Checker</title>
</head>
<body>
  <h2>Check Palindrome</h2>
  <input id="word" type="text" placeholder="Enter text">
  <button onclick="checkPalindrome()">Check</button>
  <p id="result"></p>

  <script>
    function checkPalindrome() {
      let str = document.getElementById("word").value;
      let reversed = str.split("").reverse().join("");
      if (str === reversed) {
        document.getElementById("result").innerText = str + " is a Palindrome!";
      } else {
        document.getElementById("result").innerText = str + " is NOT a Palindrome!";
      }
    }
  </script>
</body>
</html>
