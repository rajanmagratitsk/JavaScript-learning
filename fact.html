<!DOCTYPE html>
<html>
<head>
<title>Factorial</title>

<style>
body{
    font-family: Arial;
    text-align: center;
}
</style>

</head>
<body>

<h2>Factorial Of A Number</h2>

<script>

let num = 5;
let fact = 1;

for(let i = 1; i <= num; i++)
{
    fact = fact * i;
}

document.write("Factorial of " + num + " = " + fact);

</script>

</body>
</html>
