<!DOCTYPE html>
<html>
<head>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <input id="name" placeholder="Enter name">
  <button id="check">Submit</button>
  <p id="out"></p>
  <script>
    $("#check").click(()=>{
      let n=$("#name").val();
      $("#out").text(n===""?"Name required!":"Submitted: "+n);
    });
  </script>
</body>
</html>
