<!DOCTYPE html>
<html>
<body>
  <button onclick="send()">Send Data</button>
  <p id="out"></p>
  <script>
    async function send(){
      let res=await fetch("https://jsonplaceholder.typicode.com/posts",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({title:"Hello",body:"Rajan",userId:1})
      });
      let data=await res.json();
      document.getElementById("out").innerText="ID: "+data.id;
    }
  </script>
</body>
</html>
