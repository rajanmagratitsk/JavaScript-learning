<!DOCTYPE html>
<html>
<body>
  <p id="out"></p>
  <script>
    let arr=[1,2,3,4,5];
    let doubled=arr.map(x=>x*2);
    let evens=arr.filter(x=>x%2===0);
    let sum=arr.reduce((a,b)=>a+b,0);
    document.getElementById("out").innerText="Double: "+doubled+" | Evens: "+evens+" | Sum: "+sum;
  </script>
</body>
</html>
