<!DOCTYPE html>
<html>
<body>
  <p id="out"></p>
  <script>
    let target=new Date("Jan 1, 2027 00:00:00").getTime();
    let x=setInterval(()=>{
      let now=new Date().getTime();
      let diff=target-now;
      let days=Math.floor(diff/(1000*60*60*24));
      document.getElementById("out").innerText="Days left: "+days;
      if(diff<0){ clearInterval(x); document.getElementById("out").innerText="Happy New Year!"; }
    },1000);
  </script>
</body>
</html>
