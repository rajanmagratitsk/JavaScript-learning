<!DOCTYPE html>
<html>
<head>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <button id="load">Load Joke</button>
  <p id="out"></p>
  <script>
    $("#load").click(()=>{
      $.get("https://api.chucknorris.io/jokes/random",data=>{
        $("#out").text(data.value);
      });
    });
  </script>
</body>
</html>
