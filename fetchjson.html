<!DOCTYPE html>
<html>
<body>
  <button onclick="load()">Get Joke</button>
  <p id="out"></p>
  <script>
    async function load(){
      let res=await fetch("https://api.chucknorris.io/jokes/random");
      let data=await res.json();
      document.getElementById("out").innerText=data.value;
    }
  </script>
</body>
</html>
