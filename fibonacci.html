<!DOCTYPE html>
<html>
<head>
<title>Fibonacci Series</title>

<style>
body{
    font-family: Arial;
    text-align: center;
}
</style>

</head>
<body>

<h2>Fibonacci Series</h2>

<script>

let a = 1;
let b = 1;

document.write(a + " " + b + " ");

for(let i = 3; i <= 15; i++)
{
    let c = a + b;
    document.write(c + " ");
    
    a = b;
    b = c;
}

</script>

</body>
</html>
